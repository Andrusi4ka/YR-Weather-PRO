# Publishes a release with yr-weather-pro.zip for every "vX.Y.Z" tag; sites with
# the plugin then see the update (yr-weather-pro.php: yrwp_updates()).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -oP '^\s*\*?\s*Version:\s*\K\S+' yr-weather-pro.php)
          stable=$(grep -m1 -oP '^Stable tag:\s*\K\S+' readme.txt)
          if [ "$tag" != "$header" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag, yr-weather-pro.php Version $header and readme.txt Stable tag $stable must match."
            exit 1
          fi

      # git archive leaves out what .gitattributes marks export-ignore (dev files).
      - name: Build yr-weather-pro.zip
        run: git archive --format=zip --prefix=yr-weather-pro/ -o yr-weather-pro.zip HEAD

      - uses: softprops/action-gh-release@v2
        with:
          files: yr-weather-pro.zip
          generate_release_notes: true
